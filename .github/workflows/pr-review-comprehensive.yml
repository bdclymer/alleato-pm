name: PR Review with Progress Tracking

# This example demonstrates how to use the track_progress feature to get
# visual progress tracking for PR reviews, similar to v0.x agent mode.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review-with-tracking:
    # Automation-created PRs are reviewed (with a merge-gating verdict) by
    # autofix-pr-manager.yml — skip them here to avoid double reviews.
    if: |
      !startsWith(github.event.pull_request.head.ref, 'autofix/') &&
      !contains(github.event.pull_request.labels.*.name, 'automated-pr')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Enable progress tracking
          track_progress: true

          # Your custom review instructions
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive code review with the following focus areas:

            1. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Code readability and maintainability

            2. **Security**
               - Check for potential security vulnerabilities
               - Validate input sanitization
               - Review authentication/authorization logic

            3. **Performance**
               - Identify potential performance bottlenecks
               - Review database queries for efficiency
               - Check for memory leaks or resource issues

            4. **Testing**
               - Verify adequate test coverage
               - Review test quality and edge cases
               - Check for missing test scenarios

            5. **Documentation**
               - Ensure code is properly documented
               - Verify README updates for new features
               - Check API documentation accuracy

            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations or praise.

          # Tools for comprehensive PR review
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The action exits 0 even when the run errored (is_error) — the truth is
      # the final "result" entry in its execution_file. Fail loudly instead of a
      # silent green check. Common cause: invalid/expired/malformed
      # CLAUDE_CODE_OAUTH_TOKEN (stray whitespace) or an account usage limit.
      - name: Assert Claude review ran
        if: ${{ always() }}
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.claude.outcome }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          LABEL: "PR review"
        run: |
          if [ "$STEP_OUTCOME" = "skipped" ]; then echo "$LABEL skipped — nothing to assert."; exit 0; fi
          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::$LABEL produced no execution_file — the action did not run to completion (likely a credential/setup failure)."
            exit 1
          fi
          is_error=$(jq -r '[.[] | select(.type == "result")] | last | .is_error | if . == null then true else . end' "$EXEC_FILE" 2>/dev/null || echo true)
          cost=$(jq -r '[.[] | select(.type == "result")] | last | .total_cost_usd // 0' "$EXEC_FILE" 2>/dev/null || echo 0)
          turns=$(jq -r '[.[] | select(.type == "result")] | last | .num_turns // 0' "$EXEC_FILE" 2>/dev/null || echo 0)
          echo "$LABEL result: is_error=$is_error total_cost_usd=$cost num_turns=$turns"
          if [ "$is_error" != "false" ]; then
            echo "::error::$LABEL errored (is_error=$is_error, num_turns=$turns, total_cost_usd=$cost). The run did NOT do its work. Usually an invalid/expired/malformed CLAUDE_CODE_OAUTH_TOKEN (stray whitespace/newline) or a usage limit. Re-mint with 'claude setup-token' and: gh secret set CLAUDE_CODE_OAUTH_TOKEN --body \"\$(pbpaste | tr -d '[:space:]')\""
            exit 1
          fi

# When track_progress is enabled:
# - Creates a tracking comment with progress checkboxes
# - Includes all PR context (comments, attachments, images)
# - Updates progress as the review proceeds
# - Marks as completed when done
