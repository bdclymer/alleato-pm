name: Claude Code Action

# On-demand Claude: responds to explicit @claude mentions on issues, PRs, and
# review threads. Automated issue fixing lives in autofix-issue.yml and the
# automated review/merge loop lives in autofix-pr-manager.yml — this workflow
# intentionally does NOT fire on every new issue or every PR comment.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned]

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'assigned' && contains(github.event.issue.assignees.*.login, 'anthropic-claude-code'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git author
        run: |
          git config user.name "MeganHarrison"
          git config user.email "109628141+MeganHarrison@users.noreply.github.com"

      - name: Claude Code Action Official
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
