name: Issue Handler

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Triage and label issue
        uses: anthropics/claude-code-action@v1
        with:
          prompt: "/label-issue REPO: ${{ github.repository }} ISSUE_NUMBER: ${{ github.event.issue.number }}"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_non_write_users: "*"
          # Use the AUTOFIX PAT, NOT the default GITHUB_TOKEN. Triage now dispatches
          # actionable client feedback by applying the `codex:fix` label itself
          # (replacing the retired Eve triage routing). A label applied with the
          # default GITHUB_TOKEN does NOT trigger `autofix-issue.yml` (GitHub blocks
          # workflow-triggering-workflow recursion), so the fix would never start.
          # The PAT (a real user) makes the `labeled` event trigger the fix lane.
          github_token: ${{ secrets.AUTOFIX_GITHUB_TOKEN }}

